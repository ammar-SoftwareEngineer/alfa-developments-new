    <!--

  #                  Contact                       #
  ##################################################
-->
<section  class="contact-section contact-section--split py-5 animate-section"
aria-labelledby="contact-heading">
<div class="container py-5">


  <div class="row g-4 align-items-stretch">
    <div class="col-12 col-lg-6">
      <div class="contact-form-wrapper h-100">
        <div class="form-header">
          <h3 class="mb-2" data-typewriter>Send us a message</h3>
          <p class="mb-0">
            Tell us about the unit or community you are interested in — optional details help us respond faster.
          </p>
        </div>

        <form class="contact-form" id="contactForm">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="form-group">
                <label for="name">
                  <i class="fas fa-user" aria-hidden="true"></i> Full name
                </label>
                <input type="text" class="form-control" id="name" name="name" autocomplete="name"
                  placeholder="Your full name" required />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label for="email">
                  <i class="fas fa-envelope" aria-hidden="true"></i> Email
                </label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email"
                  placeholder="name@example.com" required />
              </div>
            </div>

            <div class="col-12">
              <div class="form-group">
                <label for="phone">
                  <i class="fas fa-phone" aria-hidden="true"></i> Phone
                </label>
                <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" inputmode="tel"
                  placeholder="+20 …" required />
              </div>
            </div>

            <div class="col-12">
              <div class="form-group">
                <label for="message">
                  <i class="fas fa-comment-dots" aria-hidden="true"></i> Message
                </label>
                <textarea class="form-control" id="message" name="message" rows="5"
                  placeholder="Project name, budget, or preferred area…" required></textarea>
              </div>
            </div>

            <div class="col-12 pt-1">
              <button type="submit" class="btn btn-send py-3 px-5" aria-label="Submit contact form">
                <span>Send message</span>
                <i class="fas fa-paper-plane" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="contact-map-side h-100 d-flex flex-column">

        <div class="contact-map contact-map--aside flex-grow-1 d-flex flex-column min-h-0">
          <div class="map-container flex-grow-1 h-100">
            <iframe title="Map — Alfa Real Estate Development, New Cairo area"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3454.2026574608194!2d31.462195899999998!3d30.031043299999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x145823b37a0a64a9%3A0xe06d791f70fcc569!2sALFA%20DEVELOPMENT!5e0!3m2!1sar!2seg!4v1776004876213!5m2!1sar!2seg"
              width="100%" height="100%" style="border: 0; min-height: 380px" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </div>
